<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d13"><title>Отзывы — TrainTracker</title><link rel="stylesheet" href="css/style.css"></head><body><div id="app"></div><script src="js/app.js"></script><script>if(requireAuth()){shell(`<div class="eyebrow">СООБЩЕСТВО TRAINTRACKER</div><h1>Истории и <span class="gradient">отзывы</span></h1><p class="muted" style="margin:12px 0 25px;line-height:1.8">Демо-отзывы ниже — примеры оформления, а не реальные отзывы пользователей.</p><div class="grid layout2" id="reviewList"></div><section class="card" style="margin-top:24px"><h2>Поделись своим мнением</h2><p class="muted" style="margin:8px 0 22px;font-size:13px">Расскажи, что тебе понравилось или что можно улучшить.</p><form id="reviewForm"><div class="field"><label>Имя</label><input name="name" placeholder="Введите имя" required></div><div class="field"><label>Оценка</label><div class="row" id="rating"><button type="button" class="secondary" data-r="1">★</button><button type="button" class="secondary" data-r="2">★</button><button type="button" class="secondary" data-r="3">★</button><button type="button" class="secondary" data-r="4">★</button><button type="button" class="secondary" data-r="5">★</button></div></div><div class="field"><label>Отзыв</label><textarea name="text" placeholder="Введите ваш отзыв" required rows="4"></textarea></div><button class="btn">Опубликовать отзыв</button></form></section>`,'Отзывы и обратная связь');let demo=[['Алина','Понравилось, что можно собирать тренировку под себя и не гнаться за чужими результатами.'],['Максим','Удобно, что планы сохраняются и не нужно каждый раз составлять всё заново.'],['Саша','Понятный интерфейс. На телефоне разделы легко найти.'],['Маша','Рецепты помогают придумать, что приготовить, когда нет идей.']];let rating=5;function renderReviews(){let arr=[...demo.map(x=>({name:x[0],text:x[1],rating:5,demo:true})),...allReviews()];document.getElementById('reviewList').innerHTML=arr.map(x=>`<article class="card"><div class="rating">${'★'.repeat(x.rating||5)}<span class="muted">${'☆'.repeat(5-(x.rating||5))}</span></div><p style="font-size:13px;line-height:1.8;margin:17px 0 22px">${x.text}</p><div class="row"><div class="mark" style="width:38px;height:38px;border-radius:50%;font-size:14px">${(x.name||'U')[0].toUpperCase()}</div><div><strong style="font-size:13px;display:block">${x.name}</strong><small class="muted">${x.demo?'Демо-отзыв':'Отзыв пользователя'}</small></div></div></article>`).join('')}document.querySelectorAll('#rating button').forEach(b=>b.onclick=()=>{rating=+b.dataset.r;document.querySelectorAll('#rating button').forEach(x=>{x.style.color=+x.dataset.r<=rating?'#f8cb61':'#8493a8'})});document.getElementById('reviewForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let a=allReviews();a.unshift({...d,rating,date:Date.now()});localStorage.setItem('tt_reviews',JSON.stringify(a));e.target.reset();toast('Спасибо за отзыв!');renderReviews()};renderReviews();}</script></body></html>
