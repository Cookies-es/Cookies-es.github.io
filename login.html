<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — TrainTracker</title><link rel="stylesheet" href="css/style.css"></head><body><div class="authwrap"><div class="brand" style="margin:15px 0 30px"><div class="mark">ϟ</div>Train<span class="gradient">Tracker</span></div><section class="glass authbox"><div class="eyebrow">ТВОЯ ФИТНЕС-ИСТОРИЯ</div><h1 id="title">С возвращением!</h1><p class="muted" style="margin:10px 0 25px">Войди или создай аккаунт, чтобы начать.</p><div class="row" style="margin-bottom:22px"><button class="btn" id="loginTab" onclick="mode='login';render()">Вход</button><button class="secondary" id="regTab" onclick="mode='register';render()">Регистрация</button></div><form id="form"></form><p class="caption" style="line-height:1.8;margin-top:20px">Данные сохраняются в localStorage этого браузера. Это демо-авторизация, не используй настоящий пароль.</p></section></div><script src="js/app.js"></script><script>
let mode='login';function render(){document.getElementById('title').textContent=mode==='login'?'С возвращением!':'Создай свой аккаунт';document.getElementById('loginTab').className=mode==='login'?'btn':'secondary';document.getElementById('regTab').className=mode==='register'?'btn':'secondary';let fields=mode==='register'?`<div class="field"><label>ИМЯ</label><input name="name" placeholder="Введите имя" required></div><div class="field"><label>ПОЛ</label><select name="gender" required><option value="">Выберите пол</option><option value="male">Мужской</option><option value="female">Женский</option></select></div><div class="field"><label>ВЕС, КГ</label><input name="weight" type="number" min="1" max="350" placeholder="Введите вес" required></div><div class="field"><label>РОСТ, СМ</label><input name="height" type="number" min="50" max="250" placeholder="Введите рост" required></div><div class="field"><label>ВОЗРАСТ</label><input name="age" type="number" min="1" max="120" placeholder="Введите возраст" required></div><div class="field"><label>АКТИВНОСТЬ</label><select name="activity" required><option value="">Выберите активность</option><option value="1.2">Низкая</option><option value="1.375">Лёгкая</option><option value="1.55">Средняя</option><option value="1.725">Высокая</option></select></div><div class="field"><label>ЦЕЛЬ</label><select name="goal" required><option value="">Выберите цель</option><option value="health">Здоровье</option><option value="strength">Сила</option><option value="endurance">Выносливость</option><option value="muscle">Развитие мышц</option></select></div>`:'';document.getElementById('form').innerHTML=fields+`<div class="field"><label>EMAIL</label><input name="email" type="email" placeholder="Введите email" required></div><div class="field"><label>ПАРОЛЬ</label><input name="password" type="password" minlength="6" placeholder="Введите пароль" required></div><button class="btn" style="width:100%;margin-top:8px">${mode==='login'?'Войти →':'Создать аккаунт →'}</button>`}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(mode==='register'){if(!d.name.trim()||!d.gender||!d.weight||!d.height||!d.age||!d.activity||!d.goal||!d.email||d.password.length<6){toast('Заполни все поля. Пароль — минимум 6 символов.');return}let u={...d};saveUser(u);localStorage.setItem('tt_session','1');location.href='index.html'}else{let u=getUser();if(!u||u.email!==d.email||u.password!==d.password){toast('Аккаунт не найден. Зарегистрируйся или проверь данные.');return}localStorage.setItem('tt_session','1');location.href='index.html'}});render();
</script></body></html>
