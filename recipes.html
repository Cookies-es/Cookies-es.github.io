<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d13"><title>Рецепты — TrainTracker</title><link rel="stylesheet" href="css/style.css"></head><body><div id="app"></div><script src="js/app.js"></script><script>if(requireAuth()){shell(`<div class="eyebrow">ЕДА ДЛЯ ЭНЕРГИИ</div><h1>Быстрые <span class="gradient">рецепты</span></h1><p class="muted" style="margin:12px 0 25px;line-height:1.8">Простые идеи для разнообразного питания. Подстраивай порции под свой аппетит и потребности.</p><div class="grid layout3" id="recipes"></div>`,'Идеи для разнообразного питания');let r=[['🥣','Овсянка с ягодами','Овсяные хлопья, молоко или напиток на выбор, ягоды. Смешай и приготовь до мягкости.','10 минут'],['🥪','Тост с яйцом','Цельнозерновой хлеб, яйцо, помидор и зелень. Подай вместе.','10 минут'],['🍌','Банановый смузи','Банан, молоко или йогурт, немного овсяных хлопьев. Взбей блендером.','5 минут'],['🥗','Боул с курицей','Крупа, готовая курица, овощи и любимый соус. Собери в миске.','20 минут'],['🧀','Творог с фруктами','Творог, сезонные фрукты, орехи или семечки по желанию.','5 минут'],['🌯','Домашний ролл','Лаваш, фасоль или курица, овощи и йогуртовый соус.','12 минут']];document.getElementById('recipes').innerHTML=r.map(x=>`<article class="card"><div style="font-size:45px;margin-bottom:18px">${x[0]}</div><h3>${x[1]}</h3><p class="muted" style="font-size:13px;line-height:1.8">${x[2]}</p><div class="pill" style="display:inline-block;margin-top:17px">◷ ${x[3]}</div></article>`).join('');}</script></body></html>
