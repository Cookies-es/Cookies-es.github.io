<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d13"><title>Главная — TrainTracker</title><link rel="stylesheet" href="css/style.css"></head><body><div id="app"></div><script src="js/app.js"></script><script>if(requireAuth()){shell(`
<section class="hero glass"><div class="eyebrow">ТВОЯ НОВАЯ ГЛАВА</div><h1>Привет, <span class="gradient" id="hello">спортсмен</span> 👋</h1><p class="muted" style="max-width:570px;line-height:1.8">Маленькие шаги приводят к большим изменениям. Выбирай свой темп и двигайся к самочувствию, которым будешь гордиться.</p><div class="row" style="margin-top:22px"><a class="btn" href="workouts.html">Создать тренировку →</a><a class="secondary" href="calculator.html">Рассчитать КБЖУ</a></div></section>
<div class="grid stats" id="stats"></div>
<div class="grid layout2"><section class="card"><h2>Твои данные</h2><p class="muted" style="margin:8px 0 20px;font-size:13px">Профиль и ориентиры</p><div class="grid layout3" id="bodydata"></div><a class="secondary" style="display:inline-block;margin-top:20px" href="profile.html">Редактировать профиль</a></section><section class="card"><h2>Прогресс недели</h2><p class="muted" style="margin:8px 0 25px;font-size:13px">Твой путь — это регулярность, а не гонка.</p><div class="row"><div style="font-size:50px">📈</div><div><strong style="font-size:27px" id="count">0</strong><div class="muted" style="font-size:12px">сохранённых тренировок</div></div></div><div class="bar" style="margin:20px 0"><span id="progress" style="width:0%"></span></div><p class="muted" style="font-size:12px">Каждая тренировка — повод собой гордиться.</p><a href="workouts.html" class="btn" style="display:inline-block;margin-top:17px">Мои планы</a></section></div>
<section style="margin-top:25px"><div class="row" style="justify-content:space-between;margin-bottom:18px"><h2>Быстрые рецепты</h2><a class="muted" href="recipes.html">Все рецепты →</a></div><div class="grid layout3"><div class="card"><div style="font-size:35px">🥣</div><h3>Овсянка с ягодами</h3><p class="muted">Сытный завтрак с клетчаткой.</p></div><div class="card"><div style="font-size:35px">🥪</div><h3>Тост с яйцом</h3><p class="muted">Простой вариант для перекуса.</p></div><div class="card"><div style="font-size:35px">🍌</div><h3>Банановый смузи</h3><p class="muted">Молоко, банан и немного овсянки.</p></div></div></section>`,'Твой персональный дашборд');let u=getUser(),c=calc(u);document.getElementById('hello').textContent=u.name.split(' ')[0];document.getElementById('stats').innerHTML=[['🔥','Энергия',c.kcal,'ккал'],['🥚','Белки',c.p,'г'],['🥑','Жиры',c.f,'г'],['🌾','Углеводы',c.c,'г']].map(s=>`<div class="card stat"><div class="muted">${s[0]} ${s[1]}</div><strong>${fmt(s[2])}</strong><small>${s[3]} · ориентир в день</small><div class="bar" style="margin-top:15px"><span style="width:72%"></span></div></div>`).join('');document.getElementById('bodydata').innerHTML=[['Вес',u.weight,'кг'],['Рост',u.height,'см'],['Возраст',u.age,'лет']].map(x=>`<div class="item" style="display:block"><small class="muted">${x[0]}</small><strong style="display:block;margin-top:8px">${x[1]} <small class="muted">${x[2]}</small></strong></div>`).join('');let n=allPlans().length;document.getElementById('count').textContent=n;document.getElementById('progress').style.width=Math.min(100,n*20)+'%';}</script></body></html>
