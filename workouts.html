<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d13"><title>Тренировки — TrainTracker</title><link rel="stylesheet" href="css/style.css"></head><body><div id="app"></div><script src="js/app.js"></script><script>if(requireAuth()){shell(`<div class="eyebrow">ДВИЖЕНИЕ В ТВОЁМ РИТМЕ</div><h1>Конструктор <span class="gradient">тренировок</span></h1><p class="muted" style="margin:12px 0 25px;line-height:1.8">Выбирай упражнения, составляй план и сохраняй его. Начинай с комфортной нагрузки и уделяй внимание технике.</p><div class="grid layout2"><section class="card"><div class="row" style="justify-content:space-between;margin-bottom:20px"><h2>Упражнения</h2><div class="row"><button class="secondary" id="gym">Зал</button><button class="secondary" id="home">Дом</button></div></div><div class="list" id="exerciseList"></div></section><section class="card"><h2>Твой план</h2><div class="field" style="margin-top:18px"><label>Название тренировки</label><input id="planName" placeholder="Введите название"></div><div class="list" id="planList"></div><div class="row" style="justify-content:space-between;margin-top:15px"><span class="muted" id="planCount">0 упражнений</span><button class="btn" id="savePlan">Сохранить план</button></div><h3 style="margin-top:28px">Сохранённые планы</h3><div id="savedPlans" class="list"></div></section></div>`,'Создавай планы для дома и зала');let type='gym',plan=[];const exercises={gym:[['🏋️','Жим лёжа','3 подхода · комфортный вес'],['🦵','Приседания','3 подхода · техника прежде всего'],['🪢','Тяга верхнего блока','3 подхода'],['🚴','Велотренажёр','10–15 минут в комфортном темпе'],['🚶','Беговая дорожка','Лёгкая ходьба']],home:[['💪','Отжимания','Подходы по самочувствию'],['🏋️','Гантели','Лёгкий вес, контроль движения'],['🤸','Приседания с весом тела','Комфортная амплитуда'],['🪢','Скакалка','Короткие интервалы'],['🧘','Планка','Без задержки дыхания']]};function draw(){document.getElementById('exerciseList').innerHTML=exercises[type].map((x,i)=>`<div class="item"><div style="font-size:25px">${x[0]}</div><div class="grow"><strong>${x[1]}</strong><div class="caption">${x[2]}</div></div><button class="btn" style="padding:8px 13px" onclick="add(${i})">+</button></div>`).join('');document.getElementById('gym').className=type==='gym'?'btn':'secondary';document.getElementById('home').className=type==='home'?'btn':'secondary';document.getElementById('planList').innerHTML=plan.length?plan.map((x,i)=>`<div class="item"><div class="grow"><strong>${x[1]}</strong><div class="caption">${x[2]}</div></div><button class="secondary" onclick="plan.splice(${i},1);drawPlan()">×</button></div>`).join(''):'<p class="muted" style="padding:25px;text-align:center">Добавь упражнения из списка слева.</p>';document.getElementById('planCount').textContent=plan.length+' упражнений'}function add(i){plan.push(exercises[type][i]);drawPlan()}function drawPlan(){draw()}document.getElementById('gym').onclick=()=>{type='gym';draw()};document.getElementById('home').onclick=()=>{type='home';draw()};document.getElementById('savePlan').onclick=()=>{let name=document.getElementById('planName').value.trim();if(!name||!plan.length){toast('Введи название и добавь упражнения');return}let a=allPlans();a.unshift({name,type,items:plan,date:new Date().toLocaleDateString('ru-RU')});localStorage.setItem('tt_plans',JSON.stringify(a));plan=[];document.getElementById('planName').value='';draw();saved();toast('Тренировка сохранена!')};function saved(){document.getElementById('savedPlans').innerHTML=allPlans().map((p,i)=>`<div class="item"><div class="grow"><strong>${p.name}</strong><div class="caption">${p.date} · ${p.items.length} упражн.</div></div><button class="secondary" onclick="let a=allPlans();a.splice(${i},1);localStorage.setItem('tt_plans',JSON.stringify(a));saved()">Удалить</button></div>`).join('')||'<p class="muted">Пока нет сохранённых планов.</p>'}draw();saved();}</script></body></html>
