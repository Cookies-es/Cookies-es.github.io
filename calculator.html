<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d13"><title>Калькулятор КБЖУ — TrainTracker</title><link rel="stylesheet" href="css/style.css"></head><body><div id="app"></div><script src="js/app.js"></script><script>if(requireAuth()){shell(`<div class="eyebrow">ПИТАНИЕ БЕЗ КРАЙНОСТЕЙ</div><h1>Калькулятор <span class="gradient">КБЖУ</span></h1><p class="muted" style="line-height:1.8;margin:12px 0 25px">Расчёт по формуле Миффлина — Сан Жеора. Для подростков эти формулы дают лишь приблизительную оценку: потребности роста индивидуальны.</p><div class="grid layout2"><section class="card"><h2 style="margin-bottom:20px">Твои параметры</h2><form id="calcform"><div class="field"><label>Пол</label><select name="gender"><option value="male">Мужской</option><option value="female">Женский</option></select></div><div class="field"><label>Вес, кг</label><input name="weight" type="number" min="1" max="350" placeholder="Введите вес" required></div><div class="field"><label>Рост, см</label><input name="height" type="number" min="50" max="250" placeholder="Введите рост" required></div><div class="field"><label>Возраст</label><input name="age" type="number" min="1" max="120" placeholder="Введите возраст" required></div><div class="field"><label>Активность</label><select name="activity"><option value="1.2">Низкая</option><option value="1.375">Лёгкая</option><option value="1.55">Средняя</option><option value="1.725">Высокая</option></select></div><button class="btn">Рассчитать →</button></form></section><section class="card"><div class="eyebrow">ТВОЙ РЕЗУЛЬТАТ</div><div style="padding:30px 0;text-align:center"><div class="muted">Ориентировочная энергия</div><strong class="gradient" id="kcal" style="font-size:58px;display:block;margin:10px">—</strong><div class="muted">ккал в день · не медицинская рекомендация</div></div><div class="grid layout3" id="macros"></div><p class="muted" style="font-size:12px;line-height:1.8;margin-top:25px">Важно: если тебе меньше 18 лет, не используй калькулятор для ограничения питания или снижения веса. Организм растёт и нуждается в достаточном количестве энергии. При вопросах о питании обратись к врачу или квалифицированному диетологу вместе со взрослым, которому доверяешь.</p></section></div>`,'Приблизительный расчёт потребностей');let u=getUser(),f=document.getElementById('calcform');['gender','weight','height','age','activity'].forEach(k=>{if(f.elements[k])f.elements[k].value=u[k]||f.elements[k].value});function show(d){let b=10*+d.weight+6.25*+d.height-5*+d.age+(d.gender==='male'?5:-161),k=Math.round(b*+d.activity),p=Math.round(+d.weight*1.4),fat=Math.round(+d.weight*.9),carb=Math.max(0,Math.round((k-p*4-fat*9)/4));document.getElementById('kcal').textContent=fmt(k);document.getElementById('macros').innerHTML=[['Белки',p,'#00e07a'],['Жиры',fat,'#00b8ff'],['Углеводы',carb,'#b18cff']].map(x=>`<div class="card" style="padding:15px;text-align:center"><small class="muted">${x[0]}</small><strong style="display:block;font-size:25px;margin:8px 0">${x[1]}г</strong><span style="height:4px;background:${x[2]};display:block;border-radius:9px"></span></div>`).join('')}f.addEventListener('submit',e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));if(!d.weight||!d.height||!d.age){toast('Заполни все параметры');return}show(d)});show(u);}</script></body></html>
