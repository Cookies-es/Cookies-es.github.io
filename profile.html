<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d13"><title>Профиль — TrainTracker</title><link rel="stylesheet" href="css/style.css"></head><body><div id="app"></div><script src="js/app.js"></script><script>if(requireAuth()){shell(`<div class="eyebrow">ЛИЧНЫЙ КАБИНЕТ</div><h1>Мой <span class="gradient">профиль</span></h1><p class="muted" style="margin:12px 0 25px;line-height:1.8">Редактируй данные и управляй своими настройками.</p><div class="grid layout2"><section class="card"><h2 style="margin-bottom:22px">Данные тела</h2><form id="profileForm"><div class="field"><label>Имя</label><input name="name" placeholder="Введите имя" required></div><div class="field"><label>Email</label><input name="email" type="email" placeholder="Введите email" required></div><div class="field"><label>Пол</label><select name="gender"><option value="male">Мужской</option><option value="female">Женский</option></select></div><div class="field"><label>Вес, кг</label><input name="weight" type="number" placeholder="Введите вес" required></div><div class="field"><label>Рост, см</label><input name="height" type="number" placeholder="Введите рост" required></div><div class="field"><label>Возраст</label><input name="age" type="number" placeholder="Введите возраст" required></div><div class="field"><label>Активность</label><select name="activity"><option value="1.2">Низкая</option><option value="1.375">Лёгкая</option><option value="1.55">Средняя</option><option value="1.725">Высокая</option></select></div><div class="field"><label>Цель</label><select name="goal"><option value="health">Здоровье</option><option value="strength">Сила</option><option value="endurance">Выносливость</option><option value="muscle">Развитие мышц</option></select></div><button class="btn">Сохранить изменения</button></form></section><section class="card"><h2>Аккаунт и данные</h2><p class="muted" style="font-size:13px;line-height:1.8;margin:12px 0 22px">Данные хранятся локально в браузере на этом устройстве. Очистка данных браузера может удалить профиль и планы.</p><div class="item"><span>📦</span><div class="grow"><strong>Экспорт данных</strong><div class="caption">Скачать профиль и планы в JSON</div></div><button class="secondary" id="export">Экспорт</button></div><div class="item" style="margin-top:12px"><span>🚪</span><div class="grow"><strong>Выйти</strong><div class="caption">Завершить текущую сессию</div></div><a href="login.html" onclick="logout()" class="secondary">Выйти</a></div><div class="item" style="margin-top:12px;border-color:#ff718733"><span>🗑️</span><div class="grow"><strong>Удалить профиль</strong><div class="caption">Удалить профиль и сохранённые данные</div></div><button class="secondary" id="delete">Удалить</button></div></section></div>`,'Настройки и личные данные');let u=getUser(),f=document.getElementById('profileForm');Object.keys(u).forEach(k=>{if(f.elements[k])f.elements[k].value=u[k]});f.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));saveUser({...u,...d});toast('Профиль обновлён')};document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify({user:getUser(),plans:allPlans(),reviews:allReviews()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='traintracker-data.json';a.click();URL.revokeObjectURL(a.href)};document.getElementById('delete').onclick=()=>{if(confirm('Удалить профиль, планы и отзывы на этом устройстве?')){['tt_user','tt_session','tt_plans','tt_reviews'].forEach(k=>localStorage.removeItem(k));location.href='login.html'}};}</script></body></html>
